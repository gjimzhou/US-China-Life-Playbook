name: Set up maintained toolchain
description: Shared Linux toolchain for checks and publishing
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - shell: bash
      run: |
        # The hosted runner's Azure mirror stalled while downloading fonts.
        # Keep Ubuntu's signed repositories, using its official HTTPS archive.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
        fi
        sudo timeout 300 apt-get update
        sudo timeout 300 apt-get install -y --no-install-recommends fonts-noto-cjk libharfbuzz-subset0
        python -m pip install -r requirements.txt
        npm ci
        npx playwright install --with-deps firefox
        python scripts/install_build_tools.py
