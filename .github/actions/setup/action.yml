name: Set up maintained toolchain
description: Shared Linux toolchain for checks and publishing
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends fonts-noto-cjk libharfbuzz-subset0
        python -m pip install -r requirements.txt
        npm ci
        npx playwright install --with-deps firefox
        python scripts/install_build_tools.py
