name: Shared validation and build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: _site/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-diagnostics
          path: _maintenance/
