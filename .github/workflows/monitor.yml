name: Track maintenance and deployment failures
on:
  workflow_run:
    workflows: ['Build and deploy reading site', 'External link report', 'Editorial maintenance queue']
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: monitor-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false
jobs:
  track:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!['success', 'failure', 'timed_out', 'action_required'].includes(run.conclusion)) return;
            const marker = `<!-- playbook-workflow-${run.workflow_id} -->`;
            const all = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'all', per_page: 100});
            const issue = all.find(i => !i.pull_request && (i.body || '').startsWith(marker));
            if (run.conclusion === 'success') {
              if (issue && issue.state === 'open') await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
              return;
            }
            if (issue && issue.state === 'open') return; // Repeated failures do not generate repeated notifications.
            const body = `${marker}\n工作流失败：[${run.name}](${run.html_url})。\n\n请检查失败步骤、修复后重新运行。下一次成功运行会自动关闭本问题；构建成功不代表事实完成核验。`;
            if (issue) await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'open', body});
            else await github.rest.issues.create({...context.repo, title: `维护失败：${run.name}`, body});
