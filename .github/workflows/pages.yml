name: Build and deploy reading site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ebook export tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk libharfbuzz-subset0
          python -m pip install weasyprint
      - run: python scripts/build_site.py
      - run: python scripts/check_review_regressions.py
      - run: python scripts/build_exports.py
      - run: python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact
      - name: Publish the verified reading edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          mkdir release-site
          tar -xf release-artifact/artifact.tar -C release-site
          python - <<'PYRELEASE'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('release-site/downloads/manifest.json').read_text())
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA'], 'Release source mismatch'
          PYRELEASE
          gh release create "$version" release-site/downloads/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$version：中美双栖人生指南 · 首个完整参考版" \
            --notes-file "docs/releases/$version.md" --latest
