name: External link report

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
  push:
    paths:
      - 'book/**/*.md'
      - 'checklists/**/*.md'
      - 'references/**/*.md'
      - 'README.md'
      - 'HOME.md'
      - 'DOWNLOADS.md'
      - 'DISCLAIMER.md'
      - 'METHODOLOGY.md'
      - 'STYLE.md'
      - 'CONTRIBUTING.md'
      - 'GLOSSARY.md'
      - 'scripts/check_external_links.py'
      - '.github/workflows/link-health.yml'

concurrency:
  group: external-link-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check external links
        run: python scripts/check_external_links.py --report link-health-report.md --fail-on-broken
      - name: Add report to job summary
        if: always()
        run: cat link-health-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload link health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-health
          path: link-health-report.md
          retention-days: 30
