name: Validate proposed changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
  validate:
    name: validate
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete validation
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: verified-site
          path: _site
      - name: Verify downloaded artifact integrity
        run: python scripts/check_release.py --version "$(cat VERSION)" --downloads _site/downloads --commit "$GITHUB_SHA"
